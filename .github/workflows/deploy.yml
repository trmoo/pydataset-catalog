# PyDataset 데이터 도감 — GitHub Pages 배포
# (C) 2026 티쳐무 · 모든 권리 보유. 학교 수업 목적으로만 이용해 주세요.
#
# ⚠ 저장소를 새로 만들 때 Settings → Pages → Source 를 「GitHub Actions」 로 먼저 켤 것.
#   브랜치 배포로 두면 빌드 안 한 index.html 껍데기가 서비스되어 흰 화면이 나오는데,
#   두 잡이 다 「성공」으로 찍혀 Actions 탭만 보면 알 수 없다.
# ⚠ 셸 변수 이름은 반드시 ASCII 로 쓸 것. 한글 이름을 쓰면 bash 가 command not found 로 죽는다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 시험
        run: npm test

      - name: 문법·저작권 전수 검사
        run: npm run check:syntax

      - name: 빌드
        run: npm run build

      - name: 빌드 결과 점검
        run: |
          set -e
          FILE=dist/index.html
          test -f "$FILE" || { echo "빌드 결과가 없습니다"; exit 1; }
          SIZE=$(wc -c < "$FILE")
          echo "크기: ${SIZE} 바이트"
          if [ "$SIZE" -lt 250000 ]; then echo "너무 작습니다 — 자료가 빠졌을 수 있습니다"; exit 1; fi
          MARKS=$(grep -o 티쳐무 "$FILE" | wc -l)
          echo "저작권 표시: ${MARKS}회"
          if [ "$MARKS" -lt 10 ]; then echo "저작권 표시가 모자랍니다"; exit 1; fi
          grep -q '데이터셋은 R 의 여러 패키지' "$FILE" || { echo "푸터의 출처 문구가 없습니다"; exit 1; }
          # 바깥 자원을 부르면 교실 인터넷이 없을 때 깨진다
          if grep -oE '(src|href)="https?://' "$FILE"; then echo "바깥 자원을 참조합니다"; exit 1; fi
          echo "점검 통과"

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
